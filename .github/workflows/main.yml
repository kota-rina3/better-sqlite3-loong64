name: build-loong64

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译构建 (loong64)
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 QEMU（loong64 模拟）
      uses: docker/setup-qemu-action@v4

    - name: 在龙芯容器中编译
      run: |
        docker run --platform linux/loong64 \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          linuxdeepin/deepin:crimson-loong64-v1.6.0 \
          bash -c '
            set -e
            
            apt update
            apt install -y build-essential python3 python3-setuptools ca-certificates curl xz-utils
            curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v26.4.0/node-v26.4.0-linux-loong64.tar.xz" -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            node -v
            npm -v
            npm install better-sqlite3@12.8.0 --build-from-source --runtime=electron --target=39.2.7 --arch=loong64 --dist-url=https://electronjs.org/headers --foreground-scripts
            npm install node-pty@1.1.0 --build-from-source

            # ---- 收集 .node 产物 ----
            mkdir -p dist/loong64

            cp node_modules/better-sqlite3/build/Release/better_sqlite3.node dist/loong64/ 2>/dev/null || \
              find node_modules/better-sqlite3 -name "*.node" -exec cp {} dist/loong64/ \;

            cp node_modules/node-pty/build/Release/pty.node dist/loong64/ 2>/dev/null || \
              find node_modules/node-pty -name "*.node" -exec cp {} dist/loong64/ \;
            # node-pty 运行时需要的非 .node 可执行文件
            cp node_modules/node-pty/build/Release/spawn-helper dist/loong64/ 2>/dev/null || true

            ls -l dist/loong64

            # ---- 打包 ----
            tar -czf dist/renpy-py3_13-glibc2_41-loong64.tar.gz -C dist/loong64 .
          '
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: build-loong64build-loong64
        path: dist/*.tar.gz
