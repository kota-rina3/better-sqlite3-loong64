name: build-loong64-v42.3.0

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译构建 (loong64)
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 QEMU（loong64 模拟）
      uses: docker/setup-qemu-action@v4

    - name: 在龙芯容器中编译
      run: |
        docker run --platform linux/loong64 \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          linuxdeepin/deepin:crimson-loong64-v1.6.0 \
          bash -c '
            set -e
            
            apt update
            apt install -y build-essential python3 python3-setuptools ca-certificates curl xz-utils
            curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v22.21.1/node-v22.21.1-linux-loong64.tar.xz" -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            node -v
            npm -v

            npm install --foreground-scripts

            # 2) 单独针对 Electron 42.3.0 重编 better-sqlite3
            npm rebuild better-sqlite3 \
              --runtime=electron --target=42.3.0 \
              --arch=loong64 \
              --dist-url=https://electronjs.org/headers \
              --foreground-scripts
          '
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: build-loong64-v42.3.0
        path: ./
