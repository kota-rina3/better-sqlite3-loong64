name: build-loong64-v42.3.0

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译构建 (loong64)
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 QEMU（loong64 模拟）
      uses: docker/setup-qemu-action@v4

    - name: 在龙芯容器中编译
      run: |
        docker run --platform linux/loong64 \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          linuxdeepin/deepin:crimson-loong64-v1.6.0 \
          bash -c '
            set -e

            apt update
            apt install -y build-essential python3 python3-setuptools ca-certificates curl xz-utils
            curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v22.21.1/node-v22.21.1-linux-loong64.tar.xz" -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            node -v
            npm -v

            # 1) 全量依赖：sqlite3 走 N-API 对 Node 22.21.1 编译，headers 官方存在
            npm install --foreground-scripts

            # 2) better-sqlite3 v13 无 install 脚本（prebuildify 模型，prebuilds/ 里没有 loong64），
            #    需装包后手动 node-gyp 编译；产物落 build/Release/，运行时 loader 会自动回落加载
            npm install -g node-gyp@11
            npm install better-sqlite3@13.0.3 --no-save --no-audit --no-fund
            cd node_modules/better-sqlite3
            node-gyp rebuild --release --force_build=1 \
              --runtime=electron --target=42.3.0 --arch=loong64 \
              --dist-url=https://electronjs.org/headers
            cd /workspace

            # 3) 自检：产物缺失直接失败，避免上传步骤才发现
            test -f node_modules/better-sqlite3/build/Release/better_sqlite3.node \
              || { echo "!! better_sqlite3.node 未生成"; exit 1; }
            ls -l node_modules/better-sqlite3/build/Release/
          '

    - name: 上传构建产物
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-loong64-v42.3.0
        path: node_modules/
        if-no-files-found: error
