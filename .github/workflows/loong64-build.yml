name: build-loong64

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译构建 (loong64)
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 QEMU（loong64 模拟）
      uses: docker/setup-qemu-action@v3

    - name: 在龙芯容器中编译
      run: |
        docker run --platform linux/loong64 \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          linuxdeepin/deepin:crimson-loong64 \
          bash -c '
            set -e

            apt update && apt upgrade -y
            apt install -y build-essential python3 python3-setuptools ca-certificates curl xz-utils
            curl -fsSL "https://ftp.loongnix.cn/nodejs/LoongArch/dist/v22.16.0/node-v22.16.0-linux-loong64.tar.xz" -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            node -v
            npm -v
            npm install --ignore-scripts
            npm run build-release
            node -e "const db = require(\"/project/lib\")(\":memory:\"); const r = db.prepare(\"SELECT 42 AS n\").get(); if (r.n !== 42) process.exit(1); console.log(\"loong64 smoke ok\");"
          '
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: renpy-py3_13-glibc2_41-loong64
        path: ./build
